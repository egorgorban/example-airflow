[project]
name = "example-airflow-dags"

description = "Default template for PDM package"

version = "0.1.0"

authors = [{ name = "egorgorban", email = "noreply.egorgorban@inbox.ru" }]

dependencies = [
    "apache-airflow==2.10.5",
    "apache-airflow-providers-common-compat==1.5.0",
    "apache-airflow-providers-common-io==1.5.0",
    "apache-airflow-providers-common-sql==1.23.0",
    "apache-airflow-providers-fab==1.5.2",
    "apache-airflow-providers-ftp==3.12.0",
    "apache-airflow-providers-http==5.0.0",
    "apache-airflow-providers-imap==3.8.0",
    "apache-airflow-providers-postgres==6.1.0",
    "apache-airflow-providers-smtp==1.9.0",
    "apache-airflow-providers-sqlite==4.0.0",
    "httpx==0.27.0",
    "psycopg2-binary==2.9.10",
    "pandas<2.0",
    "numpy<2.0",
    "pyarrow>=8.0.0",
    "apache-airflow-providers-google<14",
]

requires-python = "==3.12.*"

readme = "README.md"

license = { text = "MIT" }


[tool.pdm]
distribution = false

[build-system]
requires      = ["pdm-backend"]
build-backend = "pdm.backend"
